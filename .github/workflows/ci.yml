name: ci

on:
  push:
    branches: [main]
    # This suite replays the frozen pipeline four times over and takes the better part of
    # half an hour. A README edit cannot change a published figure -- the report identity
    # test reads reports/ and src/, never the docs -- so a docs push does not pay for a
    # full replay. Pull requests stay unconditional.
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m pytest --cov=src/clab --cov-report=term-missing --cov-fail-under=80
